<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PlotLine – Log in or sign up</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/landing.css">
</head>
<body data-role="">
  <main class="shell">

    <!-- Left: brand + plot map -->
    <aside class="map-panel">
      <a class="brand" href="index.html">PlotLine</a>

      <div class="map-copy">
        <h1 id="mapHeadline">Property, mapped out clearly.</h1>
        <p id="mapSub">Buy, sell and connect with mediators in one place.</p>
      </div>

      <svg class="plots" viewBox="0 0 480 360" role="img" aria-label="Illustration of land plots on a street grid">
        <rect class="plot" x="12"  y="12"  width="132" height="96"/>
        <rect class="plot" x="156" y="12"  width="96"  height="96"/>
        <rect class="plot plot-key" x="264" y="12" width="204" height="96"/>
        <rect class="plot" x="12"  y="156" width="84"  height="192"/>
        <rect class="plot" x="108" y="156" width="144" height="84"/>
        <rect class="plot" x="108" y="252" width="144" height="96"/>
        <rect class="plot" x="264" y="156" width="96"  height="192"/>
        <rect class="plot" x="372" y="156" width="96"  height="90"/>
        <rect class="plot" x="372" y="258" width="96"  height="90"/>
        <path class="pin" d="M366 82 L353 52 A15 15 0 1 1 379 52 Z"/>
        <circle class="pin-dot" cx="366" cy="44" r="5"/>
      </svg>
    </aside>

    <!-- Right: role choice, then login / sign up -->
    <section class="auth-panel">

      <!-- Step 1: choose role -->
      <div id="stepRole" class="step">
        <h2>Welcome to PlotLine</h2>
        <p class="lead">How will you use PlotLine?</p>

        <div class="role-list">
          <button type="button" class="role-card" data-pick="buyer">
            <span class="role-title">I want to buy or rent</span>
            <span class="role-desc">Browse listings, search by location and contact sellers.</span>
          </button>
          <button type="button" class="role-card" data-pick="seller">
            <span class="role-title">I want to sell or rent out</span>
            <span class="role-desc">List your property, manage enquiries and track interest.</span>
          </button>
        </div>
      </div>

      <!-- Step 2: login / sign up for the chosen role -->
      <div id="stepForm" class="step" hidden>
        <button type="button" class="back" id="backBtn">&larr; Change role</button>
        <h2 id="formTitle">Buyer account</h2>

        <div class="tabs" role="tablist" aria-label="Account options">
          <button type="button" role="tab" id="tabLogin"  aria-selected="true"  aria-controls="loginForm">Log in</button>
          <button type="button" role="tab" id="tabSignup" aria-selected="false" aria-controls="signupForm">Sign up</button>
        </div>

        <p id="formMessage" class="message" role="status" aria-live="polite" hidden></p>

        <form id="loginForm" novalidate>
          <label for="loginEmail">Email</label>
          <input id="loginEmail" name="email" type="email" autocomplete="email" required>

          <label for="loginPassword">Password</label>
          <div class="pw">
            <input id="loginPassword" name="password" type="password" autocomplete="current-password" required>
            <button type="button" class="pw-toggle" data-target="loginPassword">Show</button>
          </div>

          <button type="submit" class="primary" id="loginSubmit">Log in</button>
          <p class="switch">New to PlotLine? <button type="button" class="link" data-switch="signup">Create an account</button></p>
        </form>

        <form id="signupForm" novalidate hidden>
          <label for="signupName">Full name</label>
          <input id="signupName" name="name" type="text" autocomplete="name" required>

          <label for="signupEmail">Email</label>
          <input id="signupEmail" name="email" type="email" autocomplete="email" required>

          <label for="signupPhone">Phone number <span class="opt">(10 digits)</span></label>
          <input id="signupPhone" name="phone" type="tel" autocomplete="tel" inputmode="tel" required>

          <label for="signupPassword">Password</label>
          <div class="pw">
            <input id="signupPassword" name="password" type="password" autocomplete="new-password" minlength="6" required>
            <button type="button" class="pw-toggle" data-target="signupPassword">Show</button>
          </div>
          <p class="hint">Use at least 6 characters.</p>

          <button type="submit" class="primary" id="signupSubmit">Create account</button>
          <p class="switch">Already have an account? <button type="button" class="link" data-switch="login">Log in</button></p>
        </form>
      </div>

    </section>
  </main>

  <script src="js/api.js"></script>
  
  <script src="js/data.js"></script>
  <script src="js/auth-guard.js"></script>
  <script src="js/buyer.js"></script>
   <script src="js/seller.js"></script>
  <script src="js/landing.js"></script>
</body>
</html>
